name: Build

# Nothing builds on a normal push. Builds are manual: a workflow dispatch
# (Actions tab / gh CLI) builds all three platforms and uploads the
# installers as artifacts — no release. Pushing a version tag (e.g.
# v0.0.3-alpha), the deliberate "create a release" step, builds all three
# and publishes a GitHub prerelease.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Cancel superseded runs for the same ref to save runner time.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # v6.1.0
        uses: >-
          actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up Node.js
        # v6.5.0
        uses: >-
          actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          # The embedded Pi SDK requires Node >= 22.19.0 (enforced by
          # scripts/check-electron-node.mjs at build time).
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        # `**` glob file-args to `--test` need a newer Node than the pinned
        # runner version supports, so enumerate files with `find` instead of
        # relying on the shell/runtime to expand the pattern. `resources/` holds
        # the shared permission-rules engine's tests, so include it too.
        # TEMP DIAGNOSTIC: surface failureType + error message per failing test
        # as ::error:: annotations (readable via the public Checks API).
        shell: bash
        run: |
          set +e
          npx --no-install tsx --test $(find src resources -name '*.test.ts') > test-output.log 2>&1
          tsx_exit=$?
          node --test scripts/*.test.js >> test-output.log 2>&1
          node_exit=$?
          echo "tsx_exit=$tsx_exit node_exit=$node_exit"
          {
            echo "not_ok_count=$(grep -c 'not ok' test-output.log || true)"
            while IFS= read -r line; do
              echo "$line"
              grep -A 12 -F "$line" test-output.log | awk '/failureType:/{print} /error: \|-/{f=1; next} f{print; f--}' | head -3
            done < <(grep "not ok" test-output.log)
          } > diag.log
          head -9 diag.log | while IFS= read -r line; do
            printf '::error::%s\n' "$line"
          done
          [ "$tsx_exit" -eq 0 ] && [ "$node_exit" -eq 0 ]
          [ "$tsx_exit" -eq 0 ] && [ "$node_exit" -eq 0 ]

  build:
    name: Build (${{ matrix.os }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            eb_args: "--linux AppImage"
            artifacts: |
              release/*.AppImage
          - os: windows-latest
            eb_args: "--win nsis portable"
            artifacts: |
              release/*.exe
          - os: macos-latest
            eb_args: "--mac dmg zip"
            artifacts: |
              release/*.dmg
              release/*.zip

    steps:
      - name: Checkout
        # v6.1.0
        uses: >-
          actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up Node.js
        # v6.5.0
        uses: >-
          actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          # The embedded Pi SDK requires Node >= 22.19.0 (enforced by
          # scripts/check-electron-node.mjs at build time).
          node-version: "22"
          cache: "npm"

      # postinstall validates node-pty's bundled Node-API files and Electron.
      # electron-builder also skips its default native rebuild because node-pty
      # is Node-API compatible; rebuilding it would unnecessarily require a
      # platform compiler (and optional Spectre libraries on Windows).
      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Build renderer/main/preload
        run: npm run build

      # Verifies the pinned SDK version, the built utility worker, and the
      # SDK's dist resources before packaging. (--smoke additionally boots an
      # in-memory session on Electron's Node with a scrubbed PATH; keep the
      # packaged-artifact check lighter here.)
      - name: Verify embedded Pi artifacts
        run: node scripts/verify-embedded-pi.mjs

      - name: Package with electron-builder
        shell: bash
        run: >-
          npx --no-install electron-builder
          ${{ matrix.eb_args }} --publish never
        env:
          # No certificates in alpha — don't attempt to sign the macOS app.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload installers
        # v7.0.1
        uses: >-
          actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: installers-${{ matrix.os }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish prerelease
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all installers
        # v8.0.1
        uses: >-
          actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: dist
          merge-multiple: true

      # Attaches the built installers to the release for this tag. If you
      # pre-created the release in the GitHub UI with your own notes, those
      # notes are preserved (no generate_release_notes, no body input). If the
      # tag was pushed without a release, one is created with an empty body.
      - name: Attach installers to the release
        # v3.0.2
        uses: >-
          softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228
        with:
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          files: dist/**/*
